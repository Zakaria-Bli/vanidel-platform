name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Type check and generated files
    runs-on: ubuntu-latest
    env:
      # Generators load the Payload config but do not connect to the database.
      DATABASE_URL: postgresql://payload:payload-local@127.0.0.1:5432/vanidel
      PAYLOAD_SECRET: ci-only-typecheck-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Generate Payload types
        run: pnpm generate:types
      - name: Generate Payload import map
        run: pnpm generate:importmap
      - name: Check for schema changes without a migration
        run: pnpm migrate:create ci-check --skip-empty
      - name: Check generated files are current
        run: |
          git add --intent-to-add --all src/migrations
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js' src/migrations
      - name: Type check
        run: pnpm type-check

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vanidel_test
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d vanidel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create test environment
        # The example's DATABASE_URL matches the postgres service above.
        run: cp .env.test.example .env.test
      - name: Verify committed migrations and integration tests with coverage
        run: pnpm test:coverage

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Audit dependencies
        run: pnpm audit:dependencies

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, dependency-audit]
    env:
      # The build validates env but does not connect to the database.
      DATABASE_URL: postgresql://payload:payload-local@127.0.0.1:5432/vanidel
      PAYLOAD_SECRET: ci-only-build-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: Build
        run: pnpm build
