allowBuilds:
  # Only used by next-intl's message extractor, which this project does not use.
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Deprecations we can't act on yet; keeps `pnpm install` output clean.
allowedDeprecatedVersions:
  # Keep ESLint 9: bundled react, jsx-a11y and import peer ranges exclude 10.
  # Compatibility review and upgrade criteria: docs/operations/DEPENDENCIES.md.
  eslint: 9.39.5
  # Pulled in by drizzle-kit, which @payloadcms/db-postgres pins.
  '@esbuild-kit/core-utils': 3.3.2
  '@esbuild-kit/esm-loader': 2.6.5

auditConfig:
  # Accepted braces exception; owner, exposure, and review date: docs/operations/DEPENDENCIES.md.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

overrides:
  # Security floors for transitive dependencies; rationale and removal criteria in the same document.
  body-parser: ^2.4.0
  dompurify: ^3.4.17
  esbuild: ^0.25.0
  fast-uri: ^3.1.9
  graphql-scalars: ^2.0.1
  happy-dom: ^21.0.4
  ip-address: ^10.7.4
  qs: ^6.16.1
  systeminformation: ^5.33.16
  undici: ^7.30.1
  zod: ^4.6.7
