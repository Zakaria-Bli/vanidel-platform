# VPS-wide reverse proxy. Copied to /opt/traefik on the server and run from there as its own
# compose project. Other compose projects join the external `traefik-public` network and declare
# their routes with `traefik.*` labels (see the app's docker-compose.yml). Setup: README.md.
name: traefik

services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Drop headers whose names alias a managed one (X_Forwarded_For for X-Forwarded-For).
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      # Receipt photos (up to 11 MB) can be slow to upload on a mobile connection; the default
      # read timeout is 60 s. Traefik sets no request body limit by default.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=300s
      # No forwardedHeaders settings on purpose: Traefik then replaces any client-sent
      # X-Forwarded-For with the real client address, which the app's rate limit relies on.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-public
      # Optional routes to services outside Docker, one YAML file each.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # HTTP-01 challenge on port 80. If Let's Encrypt cannot reach the server from all of its
      # validation regions, switch to the DNS challenge (README.md).
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '80:80'
      - '443:443'
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      # Read-only: Traefik only watches containers for their labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
